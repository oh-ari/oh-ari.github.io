<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochi's Lab - Site Moved</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../styles.css?v=20250107029">
    <meta http-equiv="refresh" content="5;url=https://robochi.dev/">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="title-wrapper">
                <h1 class="title">Mochi's Lab</h1>
                <button class="theme-toggle" title="Toggle Theme">
                    <span class="theme-text">2006 Theme Beta</span>
                </button>
            </div>
        </header>
        
        <main class="main-content">
            <div class="redirect-section">
                <div class="redirect-box">
                    <h2 class="redirect-title">Site Moved!</h2>
                    <p class="redirect-text">Mochi's Lab has moved to a new location.</p>
                    <p class="redirect-text">You will be automatically redirected to the new site in <span id="countdown">5</span> seconds.</p>
                    <a href="https://robochi.dev/" class="redirect-button">
                        <span class="redirect-button-text">Go to New Site</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
    
    <div class="grid-bg"></div>
    
    <div class="footer-credit">
        <span class="footer-default">Made with boredom from Mochi, for some reason</span>
        <span class="footer-easter-egg">Made with <span class="heart">❤️</span> by Mochi</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const footerCredit = document.querySelector('.footer-credit');
            
            footerCredit.addEventListener('click', function() {
                this.classList.toggle('tapped');
            });
        });

        let currentTheme = 'mochi';

        function initializeTheme() {
            const savedTheme = localStorage.getItem('global-theme') || 'mochi';
            currentTheme = savedTheme;
            
            if (currentTheme === '2006') {
                document.body.classList.add('theme-2006');
                document.querySelector('.theme-toggle').classList.add('active');
            }
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const themeText = document.querySelector('.theme-text');
            if (themeText) {
                themeText.textContent = currentTheme === '2006' ? "Mochi's Theme" : '2006 Theme Beta';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themeToggle = document.querySelector('.theme-toggle');
            
            if (currentTheme === 'mochi') {
                currentTheme = '2006';
                body.classList.add('theme-2006');
                themeToggle.classList.add('active');
                localStorage.setItem('global-theme', '2006');
            } else {
                currentTheme = 'mochi';
                body.classList.remove('theme-2006');
                themeToggle.classList.remove('active');
                localStorage.setItem('global-theme', 'mochi');
            }
            updateThemeButtonText();
        }

        // Countdown timer
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = 'https://robochi.dev/';
            }
        }, 1000);

        document.addEventListener('DOMContentLoaded', function() {
            initializeTheme();
            
            const footerCredit = document.querySelector('.footer-credit');
            const themeToggle = document.querySelector('.theme-toggle');
            
            footerCredit.addEventListener('click', function() {
                this.classList.toggle('tapped');
            });

            if (themeToggle) {
                themeToggle.addEventListener('click', toggleTheme);
            }
        });
    </script>

    <style>
        .redirect-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            animation: slideInUp .8s ease-out;
        }

        .redirect-box {
            background: var(--bg-tertiary);
            border: 2px solid var(--border-default);
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: all .3s ease;
        }

        .redirect-box:hover {
            border-color: #c9a8ff;
            background: #c9a8ff1a;
        }

        .redirect-title {
            font-size: 2rem;
            font-weight: 700;
            color: #c9a8ff;
            margin-bottom: 1.5rem;
            font-family: 'Inter', sans-serif;
        }

        .redirect-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .redirect-text:last-of-type {
            margin-bottom: 2rem;
        }

        .redirect-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #c9a8ff;
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            padding: .75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all .3s ease;
            font-family: 'Inter', sans-serif;
        }

        .redirect-button:hover {
            background: #b894ff;
            transform: translateY(-1px);
            box-shadow: var(--shadow-default);
        }

        .redirect-button-text {
            font-family: 'Inter', sans-serif;
        }

        /* 2006 Theme Styles */
        body.theme-2006 .redirect-box {
            background: var(--bg-secondary);
            border: 2px solid var(--border-default);
            border-radius: 0;
            box-shadow: none;
        }

        body.theme-2006 .redirect-title {
            color: var(--accent-purple);
            font-family: 'Verdana', Arial, sans-serif;
            font-weight: 700;
        }

        body.theme-2006 .redirect-button {
            background: var(--accent-purple);
            border: 1px solid var(--border-default);
            border-radius: 0;
            font-family: 'Verdana', Arial, sans-serif;
            color: #fff;
        }

        body.theme-2006 .redirect-button:hover {
            background: #000060;
            border-color: #000060;
        }

        @media (max-width: 768px) {
            .redirect-box {
                padding: 2rem;
                margin: 1rem;
            }
            
            .redirect-title {
                font-size: 1.5rem;
            }
            
            .redirect-text {
                font-size: 1rem;
            }
        }
    </style>
</body>
</html>
